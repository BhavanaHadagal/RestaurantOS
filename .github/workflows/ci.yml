name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: restaurantos
          POSTGRES_PASSWORD: restaurantos123
          POSTGRES_DB: restaurantos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Push database schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://restaurantos:restaurantos123@localhost:5432/restaurantos
        run: npx prisma db push

      - name: Seed database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://restaurantos:restaurantos123@localhost:5432/restaurantos
        run: node prisma/seed.js

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI service dependencies
        working-directory: ai-service
        run: |
          pip install fastapi uvicorn python-multipart python-dotenv pydantic httpx numpy Pillow opencv-python-headless

      - name: Verify AI service imports
        working-directory: ai-service
        run: python -c "import main; print('AI service OK')"
